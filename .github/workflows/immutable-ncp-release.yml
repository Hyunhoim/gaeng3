name: Immutable NCP release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Unique lowercase release ID (8-100 characters)
        required: true
        type: string
      environment:
        description: Protected GitHub Environment holding credentials and rollback state
        required: true
        type: choice
        options:
          - evaluation
          - production
      activation_generation:
        description: 1 for bootstrap; otherwise previous generation plus one
        required: true
        default: "1"
        type: string
permissions:
  contents: read

concurrency:
  group: immutable-finance-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, bind, and keyless-sign
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_OUTPUT_DIR: ${{ github.workspace }}/src/fastapi_backend/release
      PINNED_PYTHON_BASE_IMAGE: docker.io/library/python@sha256:4766d8b510c428e595d74b9cc5bbb2fae8e26316fffb4adc89908d79aacd58a2
      PINNED_RUNTIME_PLATFORM: linux/amd64
      WORKFLOW_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/immutable-ncp-release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      TRUSTED_NCP_REGISTRY: ${{ vars.NCP_REGISTRY_HOST }}
      TRUSTED_NCP_REPOSITORY: ${{ vars.NCP_IMAGE_REPOSITORY }}
      FINAL_ANSWER_PROVIDER: hyperclova
      FINAL_HCX_QUERYPLAN_ENABLED: "false"
      FINAL_HCX_INTENT_ANALYSIS_ENABLED: "true"
      FINAL_HCX_SEMANTIC_RESOLVER_ENABLED: "true"
      FINAL_ADAPTIVE_SEMANTIC_ENABLED: "true"
      FINAL_FUND_EXECUTION_POLICY: public_fund_v1_approved
      FINAL_SCHEMA_DENSE_INDEX_SHA256: 2807195ef8c233ab3218ff742a4f53e11728aa63b56bbeb6dce62bb178f6ae57
      FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256: 8c41295bf0746bf395b0898863b406f18f6cbd8a42a4cc379069e88ab85c3a09
      FINAL_SCHEMA_DENSE_CALIBRATION_ARTIFACT_SHA256: 7c748c44235b56471c7b7aa9a33b558a5b53a33ffe9669e3aae682c53d344446
      FINAL_SCHEMA_DENSE_ACTIVATION_POLICY_SHA256: 09536fbc6cb781d022cd480b6256638b7d771224430447011a6fc8b62837c4c1
      FINAL_SCHEMA_DENSE_MIN_SCORE: "0.340015"
      FINAL_SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE: "0.3"
      FINAL_SCHEMA_DENSE_MINIMUM_MARGIN: "0.034684"
      FINAL_SCHEMA_DENSE_TOP_K: "10"
      TRACKED_SCHEMA_DENSE_INDEX: ${{ github.workspace }}/src/finance_agent/artifacts/runtime/schema-dense/kure-schema-dense-production-v8-registry18-calibrated-20260905.json
      TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT: ${{ github.workspace }}/src/finance_agent/artifacts/evaluation/kure-schema-dense-calibration-registry18-20260905.json
      TRACKED_KURE_SNAPSHOT_MANIFEST: ${{ github.workspace }}/src/finance_agent/artifacts/evaluation/schema-embedding/snapshot-manifests/kure-v1-d14c8a9423946e268a0c9952fecf3a7aabd73bd9-snapshot-v2.json
      FINAL_KURE_SNAPSHOT_MANIFEST_SHA256: caa502227d3ed92bb1b5290fc7bced2202c99b70f6846e448c4608551498004c
      # Empty means verified_live_official. Cache-first can be selected only
      # through this protected Environment and only with commit-tracked,
      # independently approved inputs plus their protected SHA-256 anchors.
      APPROVED_EXTERNAL_RETRIEVAL_MODE: ${{ vars.APPROVED_EXTERNAL_RETRIEVAL_MODE }}
      APPROVED_DOCUMENT_CORPUS_ROOT: ${{ vars.APPROVED_DOCUMENT_CORPUS_ROOT }}
      APPROVED_DOCUMENT_CORPUS_MANIFEST: ${{ vars.APPROVED_DOCUMENT_CORPUS_MANIFEST }}
      APPROVED_DOCUMENT_CORPUS_MANIFEST_SHA256: ${{ vars.APPROVED_DOCUMENT_CORPUS_MANIFEST_SHA256 }}
      APPROVED_DOCUMENT_DENSE_ARTIFACT: ${{ vars.APPROVED_DOCUMENT_DENSE_ARTIFACT }}
      APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256: ${{ vars.APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256 }}
      APPROVED_DOCUMENT_CACHE_ACTIVATION: ${{ vars.APPROVED_DOCUMENT_CACHE_ACTIVATION }}
      APPROVED_DOCUMENT_CACHE_ACTIVATION_SHA256: ${{ vars.APPROVED_DOCUMENT_CACHE_ACTIVATION_SHA256 }}
      APPROVED_EXTERNAL_TEMPORAL_RELATIONS: ${{ vars.APPROVED_EXTERNAL_TEMPORAL_RELATIONS }}
      APPROVED_EXTERNAL_TEMPORAL_RELATIONS_SHA256: ${{ vars.APPROVED_EXTERNAL_TEMPORAL_RELATIONS_SHA256 }}
      APPROVED_EXTERNAL_RELATION_GRAPH: ${{ vars.APPROVED_EXTERNAL_RELATION_GRAPH }}
      APPROVED_EXTERNAL_RELATION_GRAPH_SHA256: ${{ vars.APPROVED_EXTERNAL_RELATION_GRAPH_SHA256 }}

    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          # Cache-first releases may use a separately reviewed Document Dense
          # blob larger than GitHub's ordinary file limit. The pointer and
          # downloaded object must both belong to this exact commit.
          lfs: true
          persist-credentials: false

      - name: Validate protected source and all operator inputs
        id: release_inputs
        env:
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_ACTIVATION_GENERATION: ${{ inputs.activation_generation }}
          TRUSTED_PREVIOUS_BINDING_SHA256: ${{ secrets.PREVIOUS_DEPLOYMENT_BINDING_SHA256 }}
          INPUT_ANSWER_PROVIDER: ${{ env.FINAL_ANSWER_PROVIDER }}
          INPUT_HCX_QUERYPLAN_ENABLED: ${{ env.FINAL_HCX_QUERYPLAN_ENABLED }}
          INPUT_HCX_INTENT_ANALYSIS_ENABLED: ${{ env.FINAL_HCX_INTENT_ANALYSIS_ENABLED }}
          INPUT_HCX_SEMANTIC_RESOLVER_ENABLED: ${{ env.FINAL_HCX_SEMANTIC_RESOLVER_ENABLED }}
          INPUT_ADAPTIVE_SEMANTIC_ENABLED: ${{ env.FINAL_ADAPTIVE_SEMANTIC_ENABLED }}
          INPUT_FUND_EXECUTION_POLICY: ${{ env.FINAL_FUND_EXECUTION_POLICY }}
          INPUT_SCHEMA_DENSE_INDEX_SHA256: ${{ env.FINAL_SCHEMA_DENSE_INDEX_SHA256 }}
          INPUT_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256: ${{ env.FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256 }}
          INPUT_SCHEMA_DENSE_MIN_SCORE: ${{ env.FINAL_SCHEMA_DENSE_MIN_SCORE }}
          INPUT_SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE: ${{ env.FINAL_SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE }}
          INPUT_SCHEMA_DENSE_MINIMUM_MARGIN: ${{ env.FINAL_SCHEMA_DENSE_MINIMUM_MARGIN }}
          INPUT_SCHEMA_DENSE_TOP_K: ${{ env.FINAL_SCHEMA_DENSE_TOP_K }}
          TRUSTED_SOURCE_COMMIT: ${{ github.sha }}
          TRUSTED_GITHUB_REF: ${{ github.ref }}
          TRUSTED_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          python3 src/fastapi_backend/scripts/release_ci.py validate-inputs \
            --release-id "$INPUT_RELEASE_ID" \
            --environment "$INPUT_ENVIRONMENT" \
            --registry "$TRUSTED_NCP_REGISTRY" \
            --repository "$TRUSTED_NCP_REPOSITORY" \
            --python-base-image "$PINNED_PYTHON_BASE_IMAGE" \
            --platform "$PINNED_RUNTIME_PLATFORM" \
            --activation-generation "$INPUT_ACTIVATION_GENERATION" \
            --previous-binding-sha256 "$TRUSTED_PREVIOUS_BINDING_SHA256" \
            --answer-provider "$INPUT_ANSWER_PROVIDER" \
            --hcx-queryplan-enabled "$INPUT_HCX_QUERYPLAN_ENABLED" \
            --hcx-intent-analysis-enabled "$INPUT_HCX_INTENT_ANALYSIS_ENABLED" \
            --hcx-semantic-resolver-enabled "$INPUT_HCX_SEMANTIC_RESOLVER_ENABLED" \
            --adaptive-semantic-enabled "$INPUT_ADAPTIVE_SEMANTIC_ENABLED" \
            --fund-execution-policy "$INPUT_FUND_EXECUTION_POLICY" \
            --schema-dense-index-sha256 "$INPUT_SCHEMA_DENSE_INDEX_SHA256" \
            --schema-dense-calibration-report-sha256 "$INPUT_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256" \
            --schema-dense-min-score "$INPUT_SCHEMA_DENSE_MIN_SCORE" \
            --schema-dense-hclx-candidate-min-score "$INPUT_SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE" \
            --schema-dense-minimum-margin "$INPUT_SCHEMA_DENSE_MINIMUM_MARGIN" \
            --schema-dense-top-k "$INPUT_SCHEMA_DENSE_TOP_K" \
            --source-commit "$TRUSTED_SOURCE_COMMIT" \
            --github-ref "$TRUSTED_GITHUB_REF" \
            --github-ref-protected "$TRUSTED_GITHUB_REF_PROTECTED" \
            --github-output "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$TRUSTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize the approved relation release artifact
        id: relation_artifact
        env:
          RELATION_RETRIEVAL_ARTIFACT_B64: ${{ secrets.APPROVED_RELATION_RETRIEVAL_ARTIFACT_B64 }}
          RELATION_RETRIEVAL_ARTIFACT_SHA256: ${{ vars.APPROVED_RELATION_RETRIEVAL_ARTIFACT_SHA256 }}
        run: |
          set -euo pipefail
          python3 src/fastapi_backend/scripts/release_ci.py materialize-relation-artifact \
            --output "$RUNNER_TEMP/relation-retrieval-artifact.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run release QA before any registry mutation
        env:
          QA_VENV: ${{ runner.temp }}/finance-release-qa-venv
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$QA_VENV"
          (
            cd src/finance_agent
            "$QA_VENV/bin/python" -m pip install \
              --disable-pip-version-check \
              --requirement requirements/dev.txt
          )
          "$QA_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --editable "fastapi_backend[dev]"
          "$QA_VENV/bin/python" -m pip check
          PYTHONDONTWRITEBYTECODE=1 \
            "$QA_VENV/bin/python" -m pytest -q \
            src/finance_agent/packages/finance_agent_core/tests
          PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$GITHUB_WORKSPACE/src/fastapi_backend:$GITHUB_WORKSPACE/src" \
            "$QA_VENV/bin/python" -m pytest -q src/fastapi_backend/tests
          "$QA_VENV/bin/python" -m ruff check \
            src/finance_agent/packages/finance_agent_core/src \
            src/finance_agent/packages/finance_agent_core/tests \
            fastapi_backend
          "$QA_VENV/bin/python" -m ruff format --check \
            src/finance_agent/packages/finance_agent_core/src \
            src/finance_agent/packages/finance_agent_core/tests \
            fastapi_backend
          (
            cd src/finance_agent
            "$QA_VENV/bin/python" scripts/sync-ontology.py --check
            "$QA_VENV/bin/python" scripts/check-current-release-docs.py
            PYTHONPATH="$GITHUB_WORKSPACE/src/finance_agent/packages/finance_agent_core/src" \
              "$QA_VENV/bin/python" scripts/check-submission-boundary.py \
              --profile development
          )
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize exact Adaptive runtime artifacts
        id: adaptive_artifacts
        run: |
          set -euo pipefail
          for tracked_artifact in \
            "$TRACKED_SCHEMA_DENSE_INDEX" \
            "$TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT" \
            "$TRACKED_KURE_SNAPSHOT_MANIFEST"; do
            case "$tracked_artifact" in
              "$GITHUB_WORKSPACE"/*) ;;
              *) echo "Adaptive artifact must be inside the clean checkout" >&2; exit 1 ;;
            esac
            tracked_relative="${tracked_artifact#"$GITHUB_WORKSPACE"/}"
            git ls-files --error-unmatch -- "$tracked_relative" >/dev/null || {
              echo "Adaptive artifact is not tracked by the release commit: $tracked_relative" >&2
              exit 1
            }
            test -f "$tracked_artifact"
          done
          test "$(sha256sum "$TRACKED_SCHEMA_DENSE_INDEX" | cut -d ' ' -f 1)" = \
            "$FINAL_SCHEMA_DENSE_INDEX_SHA256"
          test "$(sha256sum "$TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT" | cut -d ' ' -f 1)" = \
            "$FINAL_SCHEMA_DENSE_CALIBRATION_ARTIFACT_SHA256"
          TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT="$TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT" \
          FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256="$FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256" \
            python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT"]); d=json.loads(p.read_text(encoding="utf-8")); claimed=d.pop("report_sha256"); canonical=json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(",",":")); actual=hashlib.sha256(canonical.encode("utf-8")).hexdigest(); assert claimed == actual == os.environ["FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256"]'
          TRACKED_SCHEMA_DENSE_INDEX="$TRACKED_SCHEMA_DENSE_INDEX" \
          PACKAGED_FIELD_REGISTRY="$GITHUB_WORKSPACE/src/finance_agent/packages/finance_agent_core/src/finance_agent_core/config/field_registry.yaml" \
          FINAL_SCHEMA_DENSE_ACTIVATION_POLICY_SHA256="$FINAL_SCHEMA_DENSE_ACTIVATION_POLICY_SHA256" \
            python3 -c 'import hashlib,json,os,pathlib,re; index=json.loads(pathlib.Path(os.environ["TRACKED_SCHEMA_DENSE_INDEX"]).read_text(encoding="utf-8")); registry=pathlib.Path(os.environ["PACKAGED_FIELD_REGISTRY"]).read_bytes(); version=re.search(rb"^schema_version:\s*\"([^\"]+)\"",registry,re.MULTILINE); assert version is not None; manifest=index["manifest"]; assert manifest["field_registry_sha256"] == hashlib.sha256(registry).hexdigest(); assert manifest["field_registry_schema_version"] == version.group(1).decode("ascii") == "1.8"; assert manifest["activation_policy_sha256"] == os.environ["FINAL_SCHEMA_DENSE_ACTIVATION_POLICY_SHA256"]; assert manifest["activation_status"] == "approved_candidate_only"; assert manifest["production_enabled"] is True'
          test "$(sha256sum "$TRACKED_KURE_SNAPSHOT_MANIFEST" | cut -d ' ' -f 1)" = \
            "$FINAL_KURE_SNAPSHOT_MANIFEST_SHA256"
          install -m 0444 "$TRACKED_SCHEMA_DENSE_INDEX" \
            "$RELEASE_OUTPUT_DIR/schema-dense-index.json"
          install -m 0444 "$TRACKED_SCHEMA_DENSE_CALIBRATION_REPORT" \
            "$RELEASE_OUTPUT_DIR/schema-dense-calibration-report.json"
          install -m 0444 "$TRACKED_KURE_SNAPSHOT_MANIFEST" \
            "$RELEASE_OUTPUT_DIR/kure-snapshot-manifest.json"
          {
            echo "schema_dense_index=$RELEASE_OUTPUT_DIR/schema-dense-index.json"
            echo "schema_dense_index_sha256=$FINAL_SCHEMA_DENSE_INDEX_SHA256"
            echo "calibration_report_sha256=$FINAL_SCHEMA_DENSE_CALIBRATION_REPORT_SHA256"
            echo "kure_snapshot_manifest_sha256=$FINAL_KURE_SNAPSHOT_MANIFEST_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Create AgentReleaseManifest from the clean checkout
        env:
          RELEASE_ID: ${{ steps.release_inputs.outputs.release_id }}
          RELEASE_ENVIRONMENT: ${{ steps.release_inputs.outputs.environment }}
          SOURCE_COMMIT: ${{ steps.release_inputs.outputs.source_commit }}
          RUNTIME_PLATFORM: ${{ steps.release_inputs.outputs.platform }}
          ANSWER_PROVIDER: ${{ steps.release_inputs.outputs.answer_provider }}
          HCX_QUERYPLAN_ENABLED: ${{ steps.release_inputs.outputs.hcx_queryplan_enabled }}
          HCX_INTENT_ANALYSIS_ENABLED: ${{ steps.release_inputs.outputs.hcx_intent_analysis_enabled }}
          HCX_SEMANTIC_RESOLVER_ENABLED: ${{ steps.release_inputs.outputs.hcx_semantic_resolver_enabled }}
          ADAPTIVE_SEMANTIC_ENABLED: ${{ steps.release_inputs.outputs.adaptive_semantic_enabled }}
          FUND_EXECUTION_POLICY: ${{ steps.release_inputs.outputs.fund_execution_policy }}
          SCHEMA_DENSE_INDEX: ${{ steps.adaptive_artifacts.outputs.schema_dense_index }}
          SCHEMA_DENSE_INDEX_SHA256: ${{ steps.adaptive_artifacts.outputs.schema_dense_index_sha256 }}
          SCHEMA_DENSE_CALIBRATION_REPORT_SHA256: ${{ steps.adaptive_artifacts.outputs.calibration_report_sha256 }}
          SCHEMA_DENSE_MIN_SCORE: ${{ steps.release_inputs.outputs.schema_dense_min_score }}
          SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE: ${{ steps.release_inputs.outputs.schema_dense_hclx_candidate_min_score }}
          SCHEMA_DENSE_MINIMUM_MARGIN: ${{ steps.release_inputs.outputs.schema_dense_minimum_margin }}
          SCHEMA_DENSE_TOP_K: ${{ steps.release_inputs.outputs.schema_dense_top_k }}
          MODEL_ID: ${{ steps.release_inputs.outputs.model_id }}
          RELATION_RETRIEVAL_ARTIFACT_FILE: ${{ steps.relation_artifact.outputs.artifact_path }}
          RELATION_RETRIEVAL_ARTIFACT_SHA256: ${{ steps.relation_artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/release-venv"
          python3 src/fastapi_backend/scripts/build_runtime_core.py \
            --source src/finance_agent/packages/finance_agent_core \
            --output "$RUNNER_TEMP/manifest-runtime-core" \
            --manifest src/fastapi_backend/runtime-core-manifest.json \
            --pyproject src/fastapi_backend/runtime-core-pyproject.toml
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --constraint src/finance_agent/requirements/constraints.txt \
            --requirement src/fastapi_backend/requirements.txt \
            ./src/finance_agent/packages/finance_agent_core
          external_mode="${APPROVED_EXTERNAL_RETRIEVAL_MODE:-verified_live_official}"
          external_arguments=(
            --mode "$external_mode"
            --artifact "$RELEASE_OUTPUT_DIR/external-knowledge-artifact.json"
            --temporal-relations "$RELEASE_OUTPUT_DIR/external-temporal-relations.json"
          )
          if [ "$external_mode" = "approved_corpus_cache_first" ] || \
             [ "$external_mode" = "approved_corpus_cache_only" ]; then
            required_cache_inputs=(
              APPROVED_DOCUMENT_CORPUS_ROOT
              APPROVED_DOCUMENT_CORPUS_MANIFEST
              APPROVED_DOCUMENT_CORPUS_MANIFEST_SHA256
              APPROVED_DOCUMENT_DENSE_ARTIFACT
              APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256
              APPROVED_DOCUMENT_CACHE_ACTIVATION
              APPROVED_DOCUMENT_CACHE_ACTIVATION_SHA256
              APPROVED_EXTERNAL_TEMPORAL_RELATIONS
              APPROVED_EXTERNAL_TEMPORAL_RELATIONS_SHA256
            )
            for input_name in "${required_cache_inputs[@]}"; do
              test -n "${!input_name:-}" || {
                echo "Protected Document Dense input is missing: $input_name" >&2
                exit 1
              }
            done
            tracked_cache_paths=(
              "$APPROVED_DOCUMENT_CORPUS_MANIFEST"
              "$APPROVED_DOCUMENT_CACHE_ACTIVATION"
              "$APPROVED_EXTERNAL_TEMPORAL_RELATIONS"
            )
            for tracked_relative in "${tracked_cache_paths[@]}"; do
              case "$tracked_relative" in
                /*|../*|*/../*|*/..) echo "Approved cache path is outside the checkout" >&2; exit 1 ;;
              esac
              git ls-files --error-unmatch -- "$tracked_relative" >/dev/null || {
                echo "Approved cache input is not tracked by the release commit: $tracked_relative" >&2
                exit 1
              }
              test -f "$GITHUB_WORKSPACE/$tracked_relative"
            done
            case "$APPROVED_DOCUMENT_DENSE_ARTIFACT" in
              /*|../*|*/../*|*/..) echo "Approved Document Dense path is outside the checkout" >&2; exit 1 ;;
            esac
            # The current approved candidate is about 435 MB. It must not be
            # copied into ordinary Git or reconstructed from a developer's
            # /tmp directory. Approved cache modes stay fail-closed until an
            # independently approved Git LFS object is committed and the
            # protected Environment pins its exact content SHA-256.
            git ls-files --error-unmatch -- "$APPROVED_DOCUMENT_DENSE_ARTIFACT" >/dev/null || {
              echo "Approved Document Dense pointer is not tracked by the release commit" >&2
              exit 1
            }
            dense_lfs_filter="$(git check-attr filter -- "$APPROVED_DOCUMENT_DENSE_ARTIFACT" | sed 's/^.*: filter: //')"
            test "$dense_lfs_filter" = "lfs" || {
              echo "Approved Document Dense artifact must be materialized from Git LFS" >&2
              exit 1
            }
            git cat-file blob "HEAD:$APPROVED_DOCUMENT_DENSE_ARTIFACT" | \
              grep -Fqx "oid sha256:$APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256" || {
              echo "Document Dense LFS object ID does not match the protected SHA-256" >&2
              exit 1
            }
            test -f "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_DENSE_ARTIFACT"
            test "$(sha256sum "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_DENSE_ARTIFACT" | cut -d ' ' -f 1)" = \
              "$APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256"
            test "$(sha256sum "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_MANIFEST" | cut -d ' ' -f 1)" = \
              "$APPROVED_DOCUMENT_CORPUS_MANIFEST_SHA256"
            test "$(sha256sum "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CACHE_ACTIVATION" | cut -d ' ' -f 1)" = \
              "$APPROVED_DOCUMENT_CACHE_ACTIVATION_SHA256"
            test "$(sha256sum "$GITHUB_WORKSPACE/$APPROVED_EXTERNAL_TEMPORAL_RELATIONS" | cut -d ' ' -f 1)" = \
              "$APPROVED_EXTERNAL_TEMPORAL_RELATIONS_SHA256"
            case "$APPROVED_DOCUMENT_CORPUS_ROOT" in
              /*|../*|*/../*|*/..) echo "Approved corpus root is outside the checkout" >&2; exit 1 ;;
            esac
            test -d "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_ROOT"
            external_arguments+=(
              --approved-corpus-manifest "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_MANIFEST"
              --approved-corpus-root "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_ROOT"
              --approved-corpus-manifest-sha256 "$APPROVED_DOCUMENT_CORPUS_MANIFEST_SHA256"
              --approved-document-dense "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_DENSE_ARTIFACT"
              --approved-document-dense-sha256 "$APPROVED_DOCUMENT_DENSE_ARTIFACT_SHA256"
              --document-dense-output "$RELEASE_OUTPUT_DIR/document-dense-approved.json"
              --document-cache-activation "$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CACHE_ACTIVATION"
              --document-cache-activation-sha256 "$APPROVED_DOCUMENT_CACHE_ACTIVATION_SHA256"
              --document-cache-activation-output "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
              --approved-temporal-relations "$GITHUB_WORKSPACE/$APPROVED_EXTERNAL_TEMPORAL_RELATIONS"
              --approved-temporal-relations-sha256 "$APPROVED_EXTERNAL_TEMPORAL_RELATIONS_SHA256"
            )
          elif [ "$external_mode" = "verified_live_official_with_relation_graph" ]; then
            for input_name in APPROVED_EXTERNAL_RELATION_GRAPH APPROVED_EXTERNAL_RELATION_GRAPH_SHA256; do
              test -n "${!input_name:-}" || {
                echo "Protected relation graph input is missing: $input_name" >&2
                exit 1
              }
            done
            case "$APPROVED_EXTERNAL_RELATION_GRAPH" in
              /*|../*|*/../*|*/..) echo "Approved relation graph path is outside the checkout" >&2; exit 1 ;;
            esac
            git ls-files --error-unmatch -- "$APPROVED_EXTERNAL_RELATION_GRAPH" >/dev/null || {
              echo "Approved relation graph is not tracked by the release commit: $APPROVED_EXTERNAL_RELATION_GRAPH" >&2
              exit 1
            }
            test -f "$GITHUB_WORKSPACE/$APPROVED_EXTERNAL_RELATION_GRAPH"
            external_arguments+=(
              --approved-relation-graph "$GITHUB_WORKSPACE/$APPROVED_EXTERNAL_RELATION_GRAPH"
              --approved-relation-graph-sha256 "$APPROVED_EXTERNAL_RELATION_GRAPH_SHA256"
            )
          elif [ "$external_mode" != "verified_live_official" ]; then
            echo "Protected external retrieval mode is invalid" >&2
            exit 1
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src/finance_agent/packages/finance_agent_core/src" \
            "$RUNNER_TEMP/release-venv/bin/python" \
            -m finance_agent_core.retrieval.external_knowledge_release_cli \
            "${external_arguments[@]}"
          if [ "$external_mode" = "approved_corpus_cache_first" ] || \
             [ "$external_mode" = "approved_corpus_cache_only" ]; then
            APPROVED_CORPUS_MANIFEST_SOURCE="$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_MANIFEST" \
            APPROVED_CORPUS_SOURCE_ROOT="$GITHUB_WORKSPACE/$APPROVED_DOCUMENT_CORPUS_ROOT" \
            APPROVED_CORPUS_REPOSITORY_ROOT="$APPROVED_DOCUMENT_CORPUS_ROOT" \
            APPROVED_CORPUS_RELEASE_ROOT="$RELEASE_OUTPUT_DIR/approved-corpus" \
            APPROVED_CORPUS_RELEASE_MANIFEST="$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json" \
              python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path, PurePosixPath

          repository_root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          source_manifest = Path(os.environ["APPROVED_CORPUS_MANIFEST_SOURCE"])
          repository_relative_root_value = os.environ["APPROVED_CORPUS_REPOSITORY_ROOT"]
          repository_relative_root = PurePosixPath(repository_relative_root_value)
          if (
              repository_relative_root.is_absolute()
              or repository_relative_root.as_posix() != repository_relative_root_value
              or any(
                  part in {"", ".", ".."}
                  for part in repository_relative_root_value.split("/")
              )
          ):
              raise RuntimeError("approved corpus root is not a canonical repository path")
          source_root = Path(os.environ["APPROVED_CORPUS_SOURCE_ROOT"]).resolve(strict=True)
          try:
              source_root.relative_to(repository_root)
          except ValueError as error:
              raise RuntimeError("approved corpus root escaped the release checkout") from error
          release_root = Path(os.environ["APPROVED_CORPUS_RELEASE_ROOT"])
          release_manifest = Path(os.environ["APPROVED_CORPUS_RELEASE_MANIFEST"])
          manifest_bytes = source_manifest.read_bytes()
          manifest = json.loads(manifest_bytes)
          documents = manifest["documents"]
          release_root.mkdir(mode=0o755)

          def command_output(*arguments: str) -> bytes:
              completed = subprocess.run(
                  arguments,
                  cwd=repository_root,
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if completed.returncode != 0:
                  raise RuntimeError("cannot verify approved corpus Git identity")
              return completed.stdout

          def require_head_tracked_document(
              repository_path: str,
              payload: bytes,
              expected_sha256: str,
              expected_size: int,
          ) -> None:
              entries = [
                  entry
                  for entry in command_output(
                      "git", "ls-tree", "-z", "HEAD", "--", repository_path
                  ).split(b"\0")
                  if entry
              ]
              if len(entries) != 1 or b"\t" not in entries[0]:
                  raise RuntimeError("approved corpus document is not tracked by HEAD")
              identity, encoded_path = entries[0].split(b"\t", 1)
              try:
                  mode, object_type, _object_id = identity.decode("ascii").split(" ", 2)
                  tracked_path = encoded_path.decode("utf-8")
              except (UnicodeError, ValueError) as error:
                  raise RuntimeError("approved corpus Git identity is invalid") from error
              if (
                  mode not in {"100644", "100755"}
                  or object_type != "blob"
                  or tracked_path != repository_path
              ):
                  raise RuntimeError(
                      "approved corpus document must be a regular file tracked by HEAD"
                  )

              attribute = command_output(
                  "git", "check-attr", "filter", "--", repository_path
              ).decode("utf-8").rstrip("\n")
              head_blob = command_output("git", "cat-file", "blob", f"HEAD:{repository_path}")
              if attribute.endswith(": filter: lfs"):
                  expected_pointer = (
                      "version https://git-lfs.github.com/spec/v1\n"
                      f"oid sha256:{expected_sha256}\n"
                      f"size {expected_size}\n"
                  ).encode("ascii")
                  if head_blob != expected_pointer:
                      raise RuntimeError(
                          "approved corpus Git LFS pointer differs from the manifest"
                      )
              elif head_blob != payload:
                  raise RuntimeError(
                      "approved corpus materialized bytes differ from the HEAD blob"
                  )

          def write_exact(path: Path, payload: bytes) -> None:
              path.parent.mkdir(mode=0o755, parents=True, exist_ok=True)
              descriptor = os.open(
                  path,
                  os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                  0o444,
              )
              try:
                  os.fchmod(descriptor, 0o444)
                  view = memoryview(payload)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise RuntimeError("cannot copy approved corpus snapshot")
                      view = view[written:]
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)

          write_exact(release_manifest, manifest_bytes)
          for document in documents:
              relative = document["relative_path"]
              pure = PurePosixPath(relative)
              if (
                  pure.is_absolute()
                  or pure.as_posix() != relative
                  or any(part in {"", ".", ".."} for part in relative.split("/"))
              ):
                  raise RuntimeError("approved corpus contains an unsafe path")
              source = source_root.joinpath(*relative.split("/")).resolve(strict=True)
              if source_root not in source.parents or source.is_symlink():
                  raise RuntimeError("approved corpus snapshot escaped its root")
              info = source.stat(follow_symlinks=False)
              if not stat.S_ISREG(info.st_mode):
                  raise RuntimeError("approved corpus snapshot is not a regular file")
              data = source.read_bytes()
              if (
                  len(data) != document["content_size_bytes"]
                  or hashlib.sha256(data).hexdigest() != document["content_sha256"]
              ):
                  raise RuntimeError("approved corpus snapshot differs from its manifest")
              repository_path = (
                  repository_relative_root.joinpath(*relative.split("/")).as_posix()
              )
              require_head_tracked_document(
                  repository_path,
                  data,
                  document["content_sha256"],
                  document["content_size_bytes"],
              )
              write_exact(release_root.joinpath(*relative.split("/")), data)
          for directory, children, _files in os.walk(release_root, topdown=False):
              current = Path(directory)
              for child in children:
                  os.chmod(current / child, 0o555)
              os.chmod(current, 0o555)
          PY
          fi
          external_knowledge_artifact_sha256="$(
            sha256sum "$RELEASE_OUTPUT_DIR/external-knowledge-artifact.json" | cut -d ' ' -f 1
          )"
          manifest_arguments=(
            --release-id "$RELEASE_ID"
            --environment "$RELEASE_ENVIRONMENT"
            --source-commit "$SOURCE_COMMIT"
            --git-root "$GITHUB_WORKSPACE"
            --backend-root "$GITHUB_WORKSPACE/src/fastapi_backend/app"
            --runtime-core-root "$RUNNER_TEMP/manifest-runtime-core/src/finance_agent_core"
            --platform "$RUNTIME_PLATFORM"
            --answer-provider "$ANSWER_PROVIDER"
            --fund-execution-policy "$FUND_EXECUTION_POLICY"
            --relation-retrieval-artifact "$RELATION_RETRIEVAL_ARTIFACT_FILE"
            --relation-retrieval-artifact-sha256 "$RELATION_RETRIEVAL_ARTIFACT_SHA256"
            --external-knowledge-artifact "$RELEASE_OUTPUT_DIR/external-knowledge-artifact.json"
            --external-knowledge-artifact-sha256 "$external_knowledge_artifact_sha256"
            --output "$RELEASE_OUTPUT_DIR/agent-release-manifest.json"
          )
          if [ "$MODEL_ID" = "HCX-007" ]; then
            manifest_arguments+=(--hcx-model HCX-007)
          fi
          if [ "$HCX_QUERYPLAN_ENABLED" = "true" ]; then
            manifest_arguments+=(--hcx-queryplan-enabled)
          fi
          if [ "$HCX_INTENT_ANALYSIS_ENABLED" = "true" ]; then
            manifest_arguments+=(--hcx-intent-analysis-enabled)
          fi
          if [ "$HCX_SEMANTIC_RESOLVER_ENABLED" = "true" ]; then
            manifest_arguments+=(--hcx-semantic-resolver-enabled)
          fi
          if [ "$ADAPTIVE_SEMANTIC_ENABLED" = "true" ]; then
            manifest_arguments+=(
              --adaptive-semantic-enabled
              --schema-dense-index "$SCHEMA_DENSE_INDEX"
              --schema-dense-index-sha256 "$SCHEMA_DENSE_INDEX_SHA256"
              --schema-dense-calibration-report-sha256 "$SCHEMA_DENSE_CALIBRATION_REPORT_SHA256"
              --schema-dense-min-score "$SCHEMA_DENSE_MIN_SCORE"
              --schema-dense-hclx-candidate-min-score "$SCHEMA_DENSE_HCLX_CANDIDATE_MIN_SCORE"
              --schema-dense-minimum-margin "$SCHEMA_DENSE_MINIMUM_MARGIN"
              --schema-dense-top-k "$SCHEMA_DENSE_TOP_K"
            )
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src/finance_agent/packages/finance_agent_core/src" \
            "$RUNNER_TEMP/release-venv/bin/python" \
            -m finance_agent_core.release_cli manifest "${manifest_arguments[@]}"
          python3 src/fastapi_backend/scripts/release_ci.py verify-relation-manifest-binding \
            --manifest "$RELEASE_OUTPUT_DIR/agent-release-manifest.json" \
            --relation-artifact "$RELATION_RETRIEVAL_ARTIFACT_FILE" \
            --relation-artifact-sha256 "$RELATION_RETRIEVAL_ARTIFACT_SHA256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to NCP Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.release_inputs.outputs.registry }}
          username: ${{ secrets.NCP_REGISTRY_USERNAME }}
          password: ${{ secrets.NCP_REGISTRY_PASSWORD }}

      - name: Build and push the code-only base image
        id: base_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/fastapi_backend/Dockerfile
          target: adaptive-runtime
          platforms: ${{ steps.release_inputs.outputs.platform }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release_inputs.outputs.base_tag }}
          build-args: |
            PYTHON_BASE_IMAGE=${{ steps.release_inputs.outputs.python_base_image }}
            FINANCE_SOURCE_COMMIT=${{ steps.release_inputs.outputs.source_commit }}

      - name: Resolve the exact base image digest
        id: base_image
        env:
          BUILD_DIGEST: ${{ steps.base_build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.release_inputs.outputs.image_repository }}
        run: |
          set -euo pipefail
          python3 src/fastapi_backend/scripts/release_ci.py bind-digest \
            --digest "$BUILD_DIGEST" \
            --image-repository "$IMAGE_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and push the manifest-bound release image
        id: release_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/fastapi_backend/Dockerfile.release
          platforms: ${{ steps.release_inputs.outputs.platform }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.release_inputs.outputs.release_tag }}
          build-args: |
            BACKEND_BASE_IMAGE=${{ steps.base_image.outputs.image_reference }}
            PYTHON_BASE_IMAGE=${{ steps.release_inputs.outputs.python_base_image }}
            FINANCE_SOURCE_COMMIT=${{ steps.release_inputs.outputs.source_commit }}
            FINANCE_RELEASE_ID=${{ steps.release_inputs.outputs.release_id }}

      - name: Resolve the exact release image digest
        id: release_image
        env:
          BUILD_DIGEST: ${{ steps.release_build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ steps.release_inputs.outputs.image_repository }}
        run: |
          set -euo pipefail
          python3 src/fastapi_backend/scripts/release_ci.py bind-digest \
            --digest "$BUILD_DIGEST" \
            --image-repository "$IMAGE_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Pull and verify the exact OCI image platform and labels
        env:
          IMAGE_REFERENCE: ${{ steps.release_image.outputs.image_reference }}
          RUNTIME_PLATFORM: ${{ steps.release_inputs.outputs.platform }}
          SOURCE_COMMIT: ${{ steps.release_inputs.outputs.source_commit }}
          RELEASE_ID: ${{ steps.release_inputs.outputs.release_id }}
          BACKEND_BASE_IMAGE: ${{ steps.base_image.outputs.image_reference }}
          PYTHON_BASE_IMAGE: ${{ steps.release_inputs.outputs.python_base_image }}
        run: |
          set -euo pipefail
          docker pull --platform "$RUNTIME_PLATFORM" "$IMAGE_REFERENCE"
          docker image inspect "$IMAGE_REFERENCE" > "$RELEASE_OUTPUT_DIR/release-image-inspect.json"
          docker buildx imagetools inspect --raw "$IMAGE_REFERENCE" \
            > "$RELEASE_OUTPUT_DIR/release-image-manifest.json"
          python3 src/fastapi_backend/scripts/release_ci.py inspect-remote-manifest \
            --manifest-file "$RELEASE_OUTPUT_DIR/release-image-manifest.json" \
            --image-reference "$IMAGE_REFERENCE" \
            --platform "$RUNTIME_PLATFORM"
          python3 src/fastapi_backend/scripts/release_ci.py inspect-image \
            --inspect-file "$RELEASE_OUTPUT_DIR/release-image-inspect.json" \
            --image-reference "$IMAGE_REFERENCE" \
            --platform "$RUNTIME_PLATFORM" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --backend-base-image "$BACKEND_BASE_IMAGE" \
            --python-base-image "$PYTHON_BASE_IMAGE"

      - name: Verify the exact image runtime boundary
        env:
          IMAGE_REFERENCE: ${{ steps.release_image.outputs.image_reference }}
          RELEASE_ID: ${{ steps.release_inputs.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.release_inputs.outputs.source_commit }}
        run: |
          set -euo pipefail
          manifest_sha256="$(sha256sum "$RELEASE_OUTPUT_DIR/agent-release-manifest.json" | cut -d ' ' -f 1)"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env FINANCE_RUNTIME_IMAGE_REFERENCE="$IMAGE_REFERENCE" \
            --env FINANCE_RELEASE_ID="$RELEASE_ID" \
            --env FINANCE_SOURCE_COMMIT="$SOURCE_COMMIT" \
            --env FINANCE_RELEASE_MANIFEST_SHA256="$manifest_sha256" \
            --entrypoint python \
            -i "$IMAGE_REFERENCE" - \
            < src/fastapi_backend/scripts/image_runtime_boundary.py \
            > "$RELEASE_OUTPUT_DIR/image-runtime-boundary.json"
          python3 -c \
            'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); assert p.get("passed") is True' \
            "$RELEASE_OUTPUT_DIR/image-runtime-boundary.json"

      - name: Restore the independently trusted previous Binding
        if: steps.release_inputs.outputs.rollback_mode == 'pinned_previous_release'
        env:
          PREVIOUS_DEPLOYMENT_BINDING_B64: ${{ secrets.PREVIOUS_DEPLOYMENT_BINDING_B64 }}
          PREVIOUS_DEPLOYMENT_BINDING_SHA256: ${{ secrets.PREVIOUS_DEPLOYMENT_BINDING_SHA256 }}
        run: |
          set -euo pipefail
          python3 src/fastapi_backend/scripts/release_ci.py materialize-previous-binding \
            --output "$RUNNER_TEMP/previous-deployment-binding.json"

      - name: Create DeploymentBinding
        env:
          IMAGE_REFERENCE: ${{ steps.release_image.outputs.image_reference }}
          RUNTIME_PLATFORM: ${{ steps.release_inputs.outputs.platform }}
          ACTIVATION_GENERATION: ${{ steps.release_inputs.outputs.activation_generation }}
          ROLLBACK_MODE: ${{ steps.release_inputs.outputs.rollback_mode }}
          TRUSTED_PREVIOUS_BINDING_SHA256: ${{ secrets.PREVIOUS_DEPLOYMENT_BINDING_SHA256 }}
        run: |
          set -euo pipefail
          binding_arguments=(
            --manifest "$RELEASE_OUTPUT_DIR/agent-release-manifest.json"
            --image-reference "$IMAGE_REFERENCE"
            --platform "$RUNTIME_PLATFORM"
            --activation-generation "$ACTIVATION_GENERATION"
            --rollback-mode "$ROLLBACK_MODE"
            --output "$RELEASE_OUTPUT_DIR/deployment-binding.json"
          )
          if [ "$ROLLBACK_MODE" = "pinned_previous_release" ]; then
            binding_arguments+=(
              --rollback-binding "$RUNNER_TEMP/previous-deployment-binding.json"
              --rollback-binding-sha256 "$TRUSTED_PREVIOUS_BINDING_SHA256"
            )
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/src/finance_agent/packages/finance_agent_core/src" \
            "$RUNNER_TEMP/release-venv/bin/python" \
            -m finance_agent_core.release_cli binding "${binding_arguments[@]}"

      - name: Install cosign from a commit-pinned action
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign and verify both immutable images
        env:
          BASE_IMAGE_REFERENCE: ${{ steps.base_image.outputs.image_reference }}
          RELEASE_IMAGE_REFERENCE: ${{ steps.release_image.outputs.image_reference }}
          # NCP Container Registry does not expose the OCI 1.1 Referrers API.
          # Keep image signatures on cosign's deterministic legacy tag path.
          COSIGN_DOCKER_MEDIA_TYPES: "1"
        run: |
          set -euo pipefail
          cosign sign --yes --use-signing-config=false --new-bundle-format=false --registry-referrers-mode=legacy "$BASE_IMAGE_REFERENCE"
          cosign sign --yes --use-signing-config=false --new-bundle-format=false --registry-referrers-mode=legacy "$RELEASE_IMAGE_REFERENCE"
          cosign verify \
            --new-bundle-format=false \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$BASE_IMAGE_REFERENCE" \
            > "$RELEASE_OUTPUT_DIR/base-image-cosign-verification.json"
          cosign verify \
            --new-bundle-format=false \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$RELEASE_IMAGE_REFERENCE" \
            > "$RELEASE_OUTPUT_DIR/release-image-cosign-verification.json"

      - name: Keyless-sign and verify release control-plane files
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$RELEASE_OUTPUT_DIR/agent-release-manifest.sigstore.json" \
            "$RELEASE_OUTPUT_DIR/agent-release-manifest.json"
          cosign sign-blob --yes \
            --bundle "$RELEASE_OUTPUT_DIR/deployment-binding.sigstore.json" \
            "$RELEASE_OUTPUT_DIR/deployment-binding.json"
          cosign verify-blob \
            --bundle "$RELEASE_OUTPUT_DIR/agent-release-manifest.sigstore.json" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$RELEASE_OUTPUT_DIR/agent-release-manifest.json" \
            > "$RELEASE_OUTPUT_DIR/agent-release-manifest-verification.txt"
          cosign verify-blob \
            --bundle "$RELEASE_OUTPUT_DIR/deployment-binding.sigstore.json" \
            --certificate-identity "$WORKFLOW_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$RELEASE_OUTPUT_DIR/deployment-binding.json" \
            > "$RELEASE_OUTPUT_DIR/deployment-binding-verification.txt"
          release_knowledge_blobs=(
            "$RELEASE_OUTPUT_DIR/external-knowledge-artifact.json"
            "$RELEASE_OUTPUT_DIR/external-temporal-relations.json"
          )
          if [ -f "$RELEASE_OUTPUT_DIR/document-dense-approved.json" ]; then
            test -f "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
            test -f "$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json"
            test -d "$RELEASE_OUTPUT_DIR/approved-corpus"
            release_knowledge_blobs+=(
              "$RELEASE_OUTPUT_DIR/document-dense-approved.json"
              "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
              "$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json"
            )
          fi
          for blob in "${release_knowledge_blobs[@]}"; do
            bundle="${blob%.json}.sigstore.json"
            verification="${blob%.json}-verification.txt"
            cosign sign-blob --yes --bundle "$bundle" "$blob"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$WORKFLOW_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "$blob" > "$verification"
          done

      - name: Record non-secret release evidence
        env:
          SOURCE_COMMIT: ${{ steps.release_inputs.outputs.source_commit }}
          RELEASE_ID: ${{ steps.release_inputs.outputs.release_id }}
          RELEASE_ENVIRONMENT: ${{ steps.release_inputs.outputs.environment }}
          RUNTIME_PLATFORM: ${{ steps.release_inputs.outputs.platform }}
          BASE_IMAGE_REFERENCE: ${{ steps.base_image.outputs.image_reference }}
          RELEASE_IMAGE_REFERENCE: ${{ steps.release_image.outputs.image_reference }}
          RELATION_RETRIEVAL_ARTIFACT_SHA256: ${{ steps.relation_artifact.outputs.artifact_sha256 }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          manifest_sha256="$(sha256sum "$RELEASE_OUTPUT_DIR/agent-release-manifest.json" | cut -d ' ' -f 1)"
          binding_sha256="$(sha256sum "$RELEASE_OUTPUT_DIR/deployment-binding.json" | cut -d ' ' -f 1)"
          python3 src/fastapi_backend/scripts/release_ci.py write-metadata \
            --output "$RELEASE_OUTPUT_DIR/release-metadata.json" \
            --workflow-identity "$WORKFLOW_IDENTITY" \
            --source-commit "$SOURCE_COMMIT" \
            --release-id "$RELEASE_ID" \
            --environment "$RELEASE_ENVIRONMENT" \
            --platform "$RUNTIME_PLATFORM" \
            --base-image-reference "$BASE_IMAGE_REFERENCE" \
            --release-image-reference "$RELEASE_IMAGE_REFERENCE" \
            --manifest-sha256 "$manifest_sha256" \
            --binding-sha256 "$binding_sha256" \
            --relation-artifact-sha256 "$RELATION_RETRIEVAL_ARTIFACT_SHA256" \
            --github-run-id "$TRUSTED_RUN_ID" \
            --github-run-attempt "$TRUSTED_RUN_ATTEMPT"
          release_artifacts=(
            "$RELEASE_OUTPUT_DIR/agent-release-manifest.json"
            "$RELEASE_OUTPUT_DIR/deployment-binding.json"
            "$RELEASE_OUTPUT_DIR/external-knowledge-artifact.json"
            "$RELEASE_OUTPUT_DIR/external-temporal-relations.json"
            "$RELEASE_OUTPUT_DIR/image-runtime-boundary.json"
            "$RELEASE_OUTPUT_DIR/release-metadata.json"
            "$RELEASE_OUTPUT_DIR/schema-dense-index.json"
            "$RELEASE_OUTPUT_DIR/schema-dense-calibration-report.json"
            "$RELEASE_OUTPUT_DIR/kure-snapshot-manifest.json"
          )
          if [ -f "$RELEASE_OUTPUT_DIR/document-dense-approved.json" ]; then
            test -f "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
            test -f "$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json"
            test -d "$RELEASE_OUTPUT_DIR/approved-corpus"
            release_artifacts+=(
              "$RELEASE_OUTPUT_DIR/document-dense-approved.json"
              "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
              "$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json"
            )
            while IFS= read -r -d '' corpus_file; do
              release_artifacts+=("$corpus_file")
            done < <(find "$RELEASE_OUTPUT_DIR/approved-corpus" -type f -print0 | sort -z)
          else
            test ! -e "$RELEASE_OUTPUT_DIR/document-cache-activation.json"
            test ! -e "$RELEASE_OUTPUT_DIR/approved-corpus-manifest.json"
            test ! -e "$RELEASE_OUTPUT_DIR/approved-corpus"
          fi
          sha256sum "${release_artifacts[@]}" \
            > "$RELEASE_OUTPUT_DIR/release-artifacts.sha256"

      - name: Upload non-secret immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: immutable-release-${{ steps.release_inputs.outputs.release_id }}
