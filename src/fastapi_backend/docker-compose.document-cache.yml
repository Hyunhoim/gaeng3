# Optional fourth overlay for an independently approved Document Dense cache.
# Use only with a signed external artifact whose retrieval_mode is
# approved_corpus_cache_only or approved_corpus_cache_first. The application
# fails closed unless the index, activation receipt, exact corpus manifest and
# exact snapshot tree share one Release-pinned SHA-256 trust boundary.
services:
  backend:
    environment:
      FINANCE_EXTERNAL_DOCUMENT_DENSE_ARTIFACT_FILE: /models/document-dense-approved.json
      FINANCE_EXTERNAL_DOCUMENT_CACHE_ACTIVATION_FILE: /run/finance-release/document-cache-activation.json
      FINANCE_EXTERNAL_DOCUMENT_CORPUS_MANIFEST_FILE: /run/finance-release/approved-corpus-manifest.json
      FINANCE_EXTERNAL_DOCUMENT_CORPUS_ROOT: /run/finance-corpus
    volumes:
      - type: bind
        source: ${FINANCE_EXTERNAL_DOCUMENT_DENSE_ARTIFACT_HOST_FILE:?required}
        target: /models/document-dense-approved.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FINANCE_EXTERNAL_DOCUMENT_CACHE_ACTIVATION_HOST_FILE:?required}
        target: /run/finance-release/document-cache-activation.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FINANCE_EXTERNAL_DOCUMENT_CORPUS_MANIFEST_HOST_FILE:?required}
        target: /run/finance-release/approved-corpus-manifest.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FINANCE_EXTERNAL_DOCUMENT_CORPUS_HOST_DIR:?required}
        target: /run/finance-corpus
        read_only: true
        bind:
          create_host_path: false
