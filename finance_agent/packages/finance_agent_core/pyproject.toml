[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent-core"
version = "0.1.0"
description = "Deterministic data and agent core for the Mirae Asset Product Finder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
finance-data-audit = "finance_agent_core.audit.cli:main"
finance-build-overseas-etp = "finance_agent_core.storage.cli:main"
finance-build-etp = "finance_agent_core.storage.cli:main"
finance-prepare-data = "finance_agent_core.storage.prepare:main"
finance-agent-answer = "finance_agent_core.agent.cli:main"
finance-knowledge-agent = "finance_agent_core.agent.knowledge_cli:main"
finance-evaluate-core = "finance_agent_core.evaluation.cli:main"
finance-evaluate-answers = "finance_agent_core.evaluation.answer_cli:main"
finance-evaluate-fund-blind = "finance_agent_core.evaluation.blind_cli:main"
finance-evaluate-fund-compare = "finance_agent_core.evaluation.comparison_cli:main"
finance-evaluate-fund-compare-e2e = "finance_agent_core.evaluation.comparison_e2e_cli:main"
finance-evaluate-fund-compare-parser = "finance_agent_core.evaluation.comparison_parser_cli:main"
finance-evaluate-product-compare = "finance_agent_core.evaluation.product_comparison_cli:main"
finance-evaluate-cross-family-search = "finance_agent_core.evaluation.cross_family_search_cli:main"
finance-benchmark-search-aggregate = "finance_agent_core.evaluation.search_aggregate_benchmark_cli:main"
finance-pre-hcx = "finance_agent_core.evaluation.pre_hcx_cli:main"
finance-evaluate-internal-red-team = "finance_agent_core.evaluation.red_team_cli:main"
finance-evaluate-domain-qa = "finance_agent_core.evaluation.domain_qa_cli:main"
finance-evaluate-briefing-examples = "finance_agent_core.evaluation.briefing_examples_cli:main"
finance-evaluate-official-acceptance = "finance_agent_core.evaluation.official_acceptance_cli:main"
finance-generate-qwen-eval-lab = "finance_agent_core.evaluation.metamorphic_cli:main"
finance-run-qwen-eval-lab = "finance_agent_core.evaluation.metamorphic_run_cli:main"
finance-generate-semantic-roundtrip = "finance_agent_core.evaluation.semantic_roundtrip_cli:main"
finance-audit-grounded-plan = "finance_agent_core.evaluation.grounded_plan_audit_cli:main"
finance-generate-coverage-plan = "finance_agent_core.evaluation.coverage_plan_cli:main"
finance-run-coverage-plan = "finance_agent_core.evaluation.coverage_run_cli:main"
finance-generate-coverage-questions = "finance_agent_core.evaluation.coverage_question_cli:main"
finance-run-coverage-questions = "finance_agent_core.evaluation.coverage_question_run_cli:main"
finance-merge-coverage-questions = "finance_agent_core.evaluation.coverage_question_merge_cli:main"
finance-merge-coverage-question-runs = "finance_agent_core.evaluation.coverage_question_run_merge_cli:main"
finance-analyze-coverage = "finance_agent_core.evaluation.coverage_analysis_cli:main"
finance-compare-coverage-profiles = "finance_agent_core.evaluation.coverage_ablation_cli:main"
finance-run-coverage-campaign = "finance_agent_core.evaluation.coverage_campaign_cli:main"
finance-render-coverage-report = "finance_agent_core.evaluation.coverage_report_cli:main"
finance-evaluate-safety-blind = "finance_agent_core.evaluation.safety_blind_cli:main"
finance-evaluate-dense-schema-linker = "finance_agent_core.evaluation.dense_schema_linker_cli:main"
finance-benchmark-schema-embeddings = "finance_agent_core.evaluation.schema_embedding_benchmark_cli:main"
finance-analyze-schema-embeddings = "finance_agent_core.evaluation.schema_embedding_analysis_cli:main"
finance-evaluate-schema-embedding-external-v2 = "finance_agent_core.evaluation.schema_embedding_external_v2_cli:main"
finance-benchmark-schema-embedding-runtime = "finance_agent_core.evaluation.schema_embedding_runtime_benchmark:main"
finance-evaluate-approved-sql = "finance_agent_core.evaluation.approved_sql_baseline_cli:main"
finance-benchmark-bm25-contract = "finance_agent_core.evaluation.bm25_contract_benchmark_cli:main"
finance-corpus = "finance_agent_core.retrieval.corpus_cli:main"
finance-relations = "finance_agent_core.retrieval.relation_cli:main"
finance-build-agent-release = "finance_agent_core.release_cli:main"
finance-validate-audit = "finance_agent_core.audit_validation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_agent_core.audit" = ["expectations.json"]
"finance_agent_core.config" = [
    "field_registry.yaml",
    "capability_matrix.json",
    "approved_dataset_manifest.json",
]
"finance_agent_core.contracts" = ["queryplan.hcx.schema.json"]
"finance_agent_core.contracts.examples" = ["*.json"]
"finance_agent_core.evaluation.suites" = ["*.json"]
"finance_agent_core.evaluation.rubrics" = ["*.json"]
"finance_agent_core.evaluation" = [
    "schema_embedding_models_v1.json",
    "schema_embedding_snapshot_manifest_v2.schema.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
