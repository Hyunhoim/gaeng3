schema_version: "1.2"

datasets:
  overseas_etp:
    source_id: PREF02N001
    source_label: 해외 ETF 마스터
    logical_grain: 거래소 코드와 종목 번호로 식별되는 해외 ETP 한 종목
    primary_key:
      - pd_exg_mkt_cd
      - pd_itm_no
    row_count: 5646
    snapshot_date: "2026-07-11"
    quarantined_rows: 10
    provenance:
      raw_file_pattern: PREF02N001*_datarows*.xlsx
      schema_file_pattern: PREF02N001*_schema*.xlsx
      static_as_of_column: cu_upt_dt
      dynamic_as_of_column: du_upt_dt
  domestic_etp:
    source_id: PREF01N001
    source_label: 국내 ETF·ETN 마스터
    logical_grain: pd_itm_no로 식별되는 국내 상장 ETP 한 종목
    primary_key:
      - pd_itm_no
    row_count: 1734
    snapshot_date: "2026-07-11"
    quarantined_rows: 1
    provenance:
      raw_file_pattern: PREF01N001*_datarows*.xlsx
      schema_file_pattern: PREF01N001*_schema*.xlsx
      static_as_of_column: wu_upt_dt
      dynamic_as_of_column: du_upt_dt
  bond:
    source_id: PRBD01N001
    source_label: 국내채권 마스터
    logical_grain: PD_NO로 식별되는 국내채권 한 종목
    primary_key:
      - PD_NO
    row_count: 42394
    snapshot_date: "2026-07-11"
    quarantined_rows: 0
    provenance:
      raw_file_pattern: PRBD01N001*_datarows*.xlsx
      schema_file_pattern: PRBD01N001*_schema*.xlsx
      static_as_of_column: __file_snapshot__
      dynamic_as_of_column: PD_STD_INFO_UPDATE

fields:
  product_id:
    label: 상품 식별자
    aliases: [상품 ID, product id]
    datasets: [overseas_etp, domestic_etp, bond]
    value_type: string
    unit: code
    source:
      dataset: overseas_etp
      columns: [pd_exg_mkt_cd, pd_itm_no]
      transform: composite_key
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    allowed_operators: [eq, in]
    notes: 거래소 코드와 종목 번호를 결합한 내부 식별자이며 ISIN을 PK로 사용하지 않는다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_itm_no]
        notes: 유효한 행에서는 pd_itm_no가 유일하다. 손상된 Excel 1155행은 격리한다.
      bond:
        source:
          dataset: bond
          columns: [PD_NO]
        notes: 42,394행에서 결측과 중복이 없는 원천 기본키다.

  product_family:
    label: 상품군
    aliases: [상품 유형군, product family]
    datasets: [overseas_etp, domestic_etp, bond]
    value_type: enum
    unit: code
    source:
      dataset: overseas_etp
      columns: []
      transform: constant
      constant_value: overseas_etp
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    allowed_operators: [eq, in]
    enum_values: [overseas_etp, domestic_etp, bond]
    notes: 이 registry 단계에서는 해외 ETP만 동결했다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: []
          transform: constant
          constant_value: domestic_etp
        notes: 국내 ETF와 ETN을 함께 나타내는 상품군이다.
      bond:
        source:
          dataset: bond
          columns: []
          transform: constant
          constant_value: bond
        notes: PRBD01N001 국내채권 마스터 상품군이다.

  product_type:
    label: ETP 유형
    aliases: [ETF 여부, ETF 또는 ETN, product type]
    datasets: [overseas_etp, domestic_etp]
    value_type: enum
    unit: code
    source:
      dataset: overseas_etp
      columns: [pd_grp_no]
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    allowed_operators: [eq, neq, in, not_in]
    enum_values: [ETF, ETN]
    notes: 원천에는 ETF 5,587행과 ETN 59행이 있으므로 ETF 질의에서 ETN을 명시적으로 제외한다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_grp_no]
        notes: 격리 행을 제외하면 ETF 1,201행, ETN 532행이다.

  product_name:
    label: 상품명
    aliases: [종목명, 펀드명, name]
    datasets: [overseas_etp, domestic_etp, bond]
    value_type: string
    source:
      dataset: overseas_etp
      columns: [pd_nm]
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    sortable: true
    allowed_operators: [eq, contains]
    notes: 이름은 5,630개 고유값으로 중복될 수 있어 식별자로 사용하지 않는다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_nm]
        coverage_pct: 100.0
        notes: 격리 행을 제외한 1,733행에서 모두 존재하고 유일하지만 PK로 사용하지 않는다.
      bond:
        source:
          dataset: bond
          columns: [PD_NM]
        coverage_pct: 100.0
        notes: 42,394행에서 모두 존재하며 상품 식별에는 PD_NO를 사용한다.

  exchange_code:
    label: 거래소 코드
    aliases: [거래소, exchange]
    datasets: [overseas_etp, domestic_etp]
    value_type: enum
    unit: code
    source:
      dataset: overseas_etp
      columns: [pd_exg_mkt_cd]
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    allowed_operators: [eq, in]
    enum_values: [AMX, NAS, NYS, "101", "102", EXG_MKT_NO_001]
    notes: 원천의 거래소 코드를 그대로 보존한다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_exg_mkt_cd]
        notes: 격리 행을 제외한 모든 값은 EXG_MKT_NO_001이다.

  ticker:
    label: 티커
    aliases: [종목 번호, symbol]
    datasets: [overseas_etp, domestic_etp, bond]
    value_type: string
    unit: code
    source:
      dataset: overseas_etp
      columns: [pd_itm_no]
    quality: VALID
    coverage_pct: 100.0
    queryable: true
    sortable: true
    allowed_operators: [eq, in]
    notes: 원천 schema의 PK 필드지만 안전한 내부 PK는 거래소 코드와 함께 구성한다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_itm_no_ma]
        notes: 미래에셋 상품번호를 사용자 표시용 종목 코드로 사용한다.
      bond:
        source:
          dataset: bond
          columns: [PD_NO]
        notes: 별도 티커 필드가 없어 PD_NO를 사용자 표시용 채권 종목 코드로 사용한다.

  isin:
    label: ISIN
    aliases: [국제 증권 식별 번호]
    datasets: [overseas_etp, domestic_etp]
    value_type: string
    unit: code
    source:
      dataset: overseas_etp
      columns: [pd_isin_cd]
    quality: PARTIAL
    coverage_pct: 99.8406
    queryable: true
    allowed_operators: [eq, in]
    notes: 9행이 없고 중복 행이 50개이므로 기본키로 사용하지 않는다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_itm_no]
        quality: VALID
        coverage_pct: 100.0
        notes: 격리 행을 제외하면 전부 유효한 KR/KRG 형식이며 유일하다.

  sellable:
    label: 판매 가능 여부
    aliases: [판매 여부, sale status]
    datasets: [overseas_etp, domestic_etp]
    value_type: boolean
    unit: boolean
    source:
      dataset: overseas_etp
      columns: [pd_sale_yn]
      transform: boolean_code
      value_map:
        "0": false
        "1": true
    quality: PARTIAL
    coverage_pct: 99.8229
    queryable: true
    allowed_operators: [eq]
    notes: 관측된 5,636행은 모두 1이고 10행이 결측이다. 코드 의미는 설명회에서 재확인한다.
    dataset_overrides:
      domestic_etp:
        source:
          dataset: domestic_etp
          columns: [pd_sale_yn]
          transform: boolean_code
          value_map:
            "0": false
            "1": true
        quality: PARTIAL
        coverage_pct: 100.0
        notes: schema의 상품판매여부를 0=false, 1=true로 잠정 매핑하며 공식 코드북 확인 전 경고한다.

