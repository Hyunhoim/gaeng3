services:
  backend:
    image: gaeng3-backend:local
    build:
      context: .
      dockerfile: fastapi_backend/Dockerfile
    init: true
    # Match the host artifact owner so 0700 directories and 0600 SQLite files
    # remain private while still being readable from the bind mount.
    user: "${BACKEND_HOST_UID:-10001}:${BACKEND_HOST_GID:-10001}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FINANCE_DB_OVERSEAS_ETP: /data/overseas_etp.sqlite3
      FINANCE_DB_DOMESTIC_ETP: /data/domestic_etp.sqlite3
      FINANCE_DB_BOND: /data/bond.sqlite3
      FINANCE_DB_FUND: /data/fund.sqlite3
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18001}:8000"
    volumes:
      - type: bind
        source: ${FINANCE_ARTIFACTS_DIR:-./finance_agent/artifacts/normalized}
        target: /data
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
