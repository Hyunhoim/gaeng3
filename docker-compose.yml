x-backend-image: &backend-image
  image: ${FINANCE_IMAGE_REFERENCE:-gaeng3-backend:local}
  build:
    context: .
    dockerfile: fastapi_backend/Dockerfile

services:
  data-init:
    <<: *backend-image
    # The one-shot initializer needs ownership privileges only for the private
    # named volume. Raw competition workbooks remain read-only.
    user: "0:0"
    command:
      - python
      - -m
      - finance_agent_core.storage.prepare
      - --data-dir
      - /raw
      - --output-dir
      - /data
      - --owner-uid
      - "${BACKEND_HOST_UID:-10001}"
      - --owner-gid
      - "${BACKEND_HOST_GID:-10001}"
    volumes:
      - type: bind
        source: ${FINANCE_RAW_DATA_DIR:-../../2. Data/1. Raw/1.금융상품}
        target: /raw
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: finance-data
        target: /data
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    <<: *backend-image
    init: true
    # Match the data volume owner so 0700 directories and 0600 SQLite files
    # remain private while still being readable by the Backend.
    user: "${BACKEND_HOST_UID:-10001}:${BACKEND_HOST_GID:-10001}"
    depends_on:
      data-init:
        condition: service_completed_successfully
        restart: true
    environment:
      # Competition-facing Compose is fail-closed: approved DB fingerprints
      # are enforced unless a development override explicitly opts out.
      # This base Compose file is the research-server development path.
      # Evaluation/production must add docker-compose.release.yml.
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      OFFICIAL_ANSWER_TIMEOUT_SECONDS: ${OFFICIAL_ANSWER_TIMEOUT_SECONDS:-270}
      OFFICIAL_ANSWER_MAX_INFLIGHT: ${OFFICIAL_ANSWER_MAX_INFLIGHT:-2}
      FINANCE_BACKEND_FUND_EXECUTION_POLICY: ${FINANCE_BACKEND_FUND_EXECUTION_POLICY:-locked}
      FINANCE_DB_OVERSEAS_ETP: /data/overseas_etp.sqlite3
      FINANCE_DB_DOMESTIC_ETP: /data/domestic_etp.sqlite3
      FINANCE_DB_BOND: /data/bond.sqlite3
      FINANCE_DB_FUND: /data/fund.sqlite3
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18001}:8000"
    volumes:
      - type: volume
        source: finance-data
        target: /data
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  finance-data:
